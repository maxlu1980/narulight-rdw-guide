}

  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F8F6EF;--surface:#FFFFFF;--raised:#F0ECE1;--inset:#E8E2D4;--fg:#0A1014;--fg2:#2A333B;--fg3:#59636E;
  --line:rgba(10,16,20,.13);--line2:rgba(10,16,20,.28);--accent:#C4F032;--accent-hover:#B5E11F;--on-accent:#05080C;--accent-ink:#4D6617;
  --water:#1F6FB5;--link:#134976;--hazard:#B5350F;--glass:rgba(248,246,239,.86);--dot:rgba(10,16,20,.11);
  --s1:#1F6FB5;--s2:#C4461A;--s3:#7A4FB8;--s0:#8A949E;
  --shadow-raised:0 1px 2px rgba(10,16,20,.08),0 4px 12px rgba(10,16,20,.08);--shadow-float:0 8px 24px rgba(10,16,20,.14),0 2px 6px rgba(10,16,20,.08);--glow:0 0 0 1px rgba(77,102,23,.6),0 0 0 4px rgba(77,102,23,.2);

html[lang^="zh"]{--font-display:'Space Grotesk','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--font-body:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--font-mono:'JetBrains Mono','Noto Sans TC',ui-monospace,Menlo,monospace}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 20px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}

a{color:var(--link);text-underline-offset:3px}button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--glow);border-radius:var(--r-sm)}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.eb{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);line-height:1.5}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:var(--r-md);background:transparent;color:var(--fg);font-weight:500;font-size:14px;line-height:1.2;text-decoration:none;cursor:pointer;transition:background-color .12s,border-color .12s,transform .08s}
.btn:hover{border-color:var(--accent-ink)}.btn:active{transform:scale(.98)}
.btn--p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn--p:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn--s{min-height:36px;padding:0 12px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ibtn{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--glass);cursor:pointer}
.ibtn:hover{border-color:var(--accent-ink)}.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.envrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.envrow select{flex:1 1 140px;min-width:0}.envsea{font-weight:500;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--line2);border-radius:999px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);line-height:1.6;white-space:nowrap}

.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

.brand span{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.brand__dev{display:block;margin-top:2px;font-family:var(--font-body);font-size:10.5px;line-height:1.3;letter-spacing:.02em;color:var(--fg2);max-width:min(60vw,360px)}   
.nav{display:flex;gap:2px 16px;margin-right:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.nav::-webkit-scrollbar{display:none}

.nav a:hover,.nav a[aria-current="true"]{color:var(--fg);border-bottom-color:var(--accent-ink)}
.head__tools{display:flex;gap:8px;align-items:center;flex:none}
.head .seg button{min-height:34px;padding:0 10px}.head .ibtn{width:36px;height:36px}
.theme .sun{display:none}:root[data-theme="light"] .theme .moon{display:none}:root[data-theme="light"] .theme .sun{display:block}

@media (max-width:980px){.nav{order:3;width:100%;margin:0}.head__tools{margin-left:auto}}


.sec{padding-block:72px;border-top:1px solid var(--line)}
.sec>.wrap{display:flex;flex-direction:column;gap:36px}
.sec__head{display:flex;flex-direction:column;gap:12px}

.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:10px}
.rule{border-top:1px solid var(--line2);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.rule h3{font-size:17px}
.num{font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.num small{font-size:15px;font-weight:500;color:var(--fg2);margin-left:4px;letter-spacing:0}


.hero{position:relative;overflow:hidden}
.hero__field{position:absolute;inset:0;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.5px);background-size:16px 16px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%);pointer-events:none}
.hero__top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px 56px;align-items:end}
.hero__copy{display:flex;flex-direction:column;gap:16px}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.fact{border-top:1px solid var(--line2);padding:12px 0 14px;display:flex;flex-direction:column;gap:2px}
.fact .num{font-size:28px}.fact span{font-size:13px;line-height:1.5;color:var(--fg2)}
@media (max-width:900px){.hero__top{grid-template-columns:1fr}}


.stage{position:relative;width:100%;aspect-ratio:16/8.2;max-height:640px;max-width:100%;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--inset)}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}.stage canvas:active{cursor:grabbing}
.stage__tl,.stage__bl,.stage__br,.stage__tr{position:absolute;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:3}
.stage__tl{left:12px;top:12px;right:64px}.stage__tr{right:12px;top:12px}.stage__bl{left:12px;bottom:12px;right:110px}.stage__br{right:12px;bottom:12px}
.stage__cap{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 10px;font-size:13px;line-height:1.4;max-width:100%}
.stage__cap b{font-family:var(--font-mono);font-weight:500;color:var(--accent-ink);margin-right:8px}
.stage__ff{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-style:normal;font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;color:var(--ink-2,inherit);vertical-align:1px;white-space:nowrap}
.stage__ff[hidden]{display:none}
.stage__labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:var(--glass);border:1px solid var(--line2);border-radius:var(--r-sm);padding:2px 8px;font-size:12px;line-height:1.5;white-space:nowrap;will-change:transform}
.lblLines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.lblLines line{stroke:var(--fg);stroke-opacity:.55;stroke-width:1}.lblLines circle{fill:var(--accent,#c8f03c);stroke:#0a0b0c;stroke-width:1}
.lbl--dim{font-family:var(--font-mono);border-color:var(--accent-ink);color:var(--accent-ink)}
.stage__fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--fg2)}
@media (max-width:700px){.stage{aspect-ratio:4/3.4}.lbl{font-size:11px;padding:1px 6px}}


.seg--mode{display:flex;width:100%}.seg--mode button{flex:1 1 0;min-height:40px;padding:0 6px;white-space:normal;line-height:1.25}
.method[data-m="fp"] .player,.method[data-m="fp"] #fillWrap,.method[data-m="micro"] #mXray,.method[data-m="micro"] #fillWrap{display:none}
.method[data-m="fp"] .stage{aspect-ratio:16/11.5}
.fpui{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;display:flex;gap:10px;align-items:flex-end;pointer-events:none}.fpui[hidden]{display:none}.fpui>*{pointer-events:auto}
.fpui__card{flex:1 1 auto;min-width:0;max-width:540px;background:var(--glass);border:1px solid var(--line2);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.fpui__t{font-family:var(--font-display);font-weight:500;font-size:17px;line-height:1.35}.fpui__d{font-size:13px;line-height:1.6;color:var(--fg2)}
.fpui__o{display:flex;flex-direction:column;gap:6px;margin-top:4px}.fpui__o:empty{display:none}.fpui__o button{justify-content:flex-start;text-align:left;min-height:40px;white-space:normal;padding:8px 12px;line-height:1.4;background:var(--surface)}
.fpui__o button[data-bad="1"]{border-color:var(--hazard);opacity:.6}
.fpui__bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}.fpui__bar i{display:block;height:100%;width:0;background:var(--accent)}
.fpui__hold{flex:none;min-height:60px;min-width:128px;font-size:15px;touch-action:none;-webkit-user-select:none;user-select:none}.fpui__hold[data-on="1"]{transform:scale(.97);background:var(--accent-hover)}
.fpui__hold[hidden]{display:none}
@media (max-width:700px){.method .stage{aspect-ratio:4/3.6}.method[data-m="fp"] .stage{aspect-ratio:3/4.3}.fpui{flex-direction:column;align-items:stretch}.fpui__hold{min-height:54px}}


.stage--hero{height:calc(100svh - var(--headH,60px));min-height:440px;max-height:none;aspect-ratio:auto;border:0;border-bottom:1px solid var(--line);border-radius:0}
.hero__scrim{position:absolute;inset:0 0 auto;height:40%;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 84%,transparent),color-mix(in srgb,var(--bg) 40%,transparent) 45%,transparent);pointer-events:none;z-index:1}
.hero__title{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:14px;right:168px;max-width:660px;z-index:3;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hero__title .h1{font-size:clamp(21px,3.2vw,44px)}.hero__title .eb{color:var(--fg2)}
.hero__env{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;z-index:7;display:flex;flex-direction:column;align-items:flex-end}

.eggt{position:absolute;left:50%;top:var(--eggTop,96px);transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:6px;width:max-content;max-width:calc(100% - 32px);padding:5px 5px 5px 14px;border:1px solid var(--line2);border-radius:999px;background:var(--glass);color:var(--fg);font-size:13px;line-height:1.35;box-shadow:0 8px 28px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:eggIn .35s ease-out}
.eggt[hidden]{display:none}.eggt__t{min-width:0}
.eggt__v{appearance:none;flex:0 0 auto;min-height:32px;padding:0 14px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 13px/1 var(--font-body);cursor:pointer}.eggt__v:hover{background:var(--accent-hover)}
.eggt__x{appearance:none;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--fg);cursor:pointer}.eggt__x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.eggt button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes eggIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.eggt{animation:none}}
.chipbtn{appearance:none;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 10px;border:1px solid var(--line2);border-radius:999px;background:var(--glass);font-family:var(--font-mono);font-size:12px;line-height:1.2;cursor:pointer;white-space:nowrap}

.chipbtn[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.pop[hidden]{display:none}.pop .eb{display:block;margin-bottom:6px}.pop .seg{display:flex;width:100%;background:transparent}.pop .seg button{flex:1 1 0;padding:0 4px;min-width:0}
.pop select{width:100%;min-height:36px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--inset);color:var(--fg);font:inherit;font-size:13px}
.hero__tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:60px;display:flex;flex-direction:column;gap:8px;z-index:4}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#tTour .i-stop{display:none}#tTour[aria-pressed="true"] .i-stop{display:inline}#tTour[aria-pressed="true"] .i-play{display:none}#tTour .i-play{fill:currentColor;stroke:none}

.vpos__d{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}.chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;line-height:1.6;color:var(--fg2)}

.vsafe{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 36px;align-items:start;margin-top:6px}.vsafe__eu{border:1px solid var(--line2);border-radius:var(--r-md);padding:12px 14px;color:var(--fg2)}@media (max-width:900px){.vsafe{grid-template-columns:1fr}}
.vd{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg);white-space:nowrap}
.vd i{width:8px;height:8px;border-radius:2px;background:var(--fg3)}.vd--n i{background:var(--accent-ink)}.vd--p i{background:var(--s2)}.vd--e{color:var(--fg3)}
.vss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.vss .num{font-size:26px}.vss dd{font-size:12px;line-height:1.5;color:var(--fg3);margin-top:2px}
.vsf{min-width:480px}.vsf tbody th{white-space:normal;width:auto;min-width:220px}.vsf td{white-space:nowrap}
.lv{display:inline-flex;gap:3px;vertical-align:middle}.lv i{width:16px;height:8px;border-radius:2px;border:1px solid var(--line2)}
.lv--p i.on{background:var(--s2);border-color:var(--s2)}.lv--n i.on{background:var(--accent-ink);border-color:var(--accent-ink)}


.quote{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}

.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

.acc>summary::-webkit-details-marker{display:none}
.acc>summary i{font:normal 500 12px/1 var(--font-mono);color:var(--accent-ink)}
.acc>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:1.5px solid var(--fg3);border-bottom:1.5px solid var(--fg3);transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.acc[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.acc__b{padding:4px 18px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.acc__b .full{grid-column:1/-1}.acc__if{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}.acc__if[hidden]{display:none}
@media (max-width:480px){.acc__b,.acc__if{grid-template-columns:1fr}}
.flabel{font-size:13px;font-weight:500;color:var(--fg2)}
.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font:13px/1.6 var(--font-mono);resize:vertical}
.logo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo__p{width:44px;height:44px;border:1px dashed var(--line2);border-radius:var(--r-sm);background:#fff;overflow:hidden;flex:none}.logo__p img{width:100%;height:100%;display:block}
.qcard{position:relative;gap:14px}
.qsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px}.qsum .meter b{font-size:20px}
@media (max-width:560px){.qsum{grid-template-columns:1fr}}
.qqty{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0 18px}.qqty div{border-top:1px solid var(--line);padding:8px 0}.qqty dt{font-size:12px;color:var(--fg3);line-height:1.5}.qqty dd{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}

.qtabs{display:flex;align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}.qtabs::-webkit-scrollbar{display:none}.qtabs button{min-height:40px;flex:none}
.qtot{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:13px;color:var(--fg2)}.qtot b{font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--fg);font-variant-numeric:tabular-nums}
.qact{display:flex;flex-wrap:wrap;gap:8px}.qact .btn{min-height:40px}
.qwarn{color:var(--hazard)}
#qtStatus:empty{display:none}#qtStatus[data-tone="bad"]{color:var(--hazard)}#qtStatus[data-tone="ok"]{color:var(--accent-ink)}
.qview{max-height:max(420px,calc(100vh - var(--head) - 250px));overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--inset);padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}

<body>
<header class="head">
  <div class="wrap">
